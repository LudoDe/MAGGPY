[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "maggpy"
dynamic = ["version"]
description = "Population inference and multimessenger predictions for short gamma-ray bursts."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

authors = [
    { name = "Alessio Ludovico De Santis" }
]

keywords = [
    "gamma-ray bursts",
    "gravitational waves",
    "multimessenger astronomy",
    "population synthesis",
    "MCMC",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.10,<2",
    "astropy>=5.3,<7",
    "pandas>=1.5,<3",
    "emcee>=3.1,<4",
    "h5py>=3.8,<4",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7,<4",
    "corner>=2.2,<3",
    "ipython>=8,<9",
]
fermi = [
    "astro-gdt-fermi>=2.1,<3",
]
gw = [
    "GWFish",
    "healpy>=1.17,<2",
    "cartopy>=0.24,<1",
]
notebooks = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<7",
    "ipywidgets>=8,<9",
    "ipympl>=0.9,<1",
    "PyYAML>=6,<7",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=6",
    "twine>=6",
    "check-wheel-contents>=0.6",
]

[project.urls]
Homepage = "https://github.com/LudoDe/MAGGPY"
Repository = "https://github.com/LudoDe/MAGGPY"
Issues = "https://github.com/LudoDe/MAGGPY/issues"

[tool.hatch.version]
path = "src/maggpy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/maggpy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/maggpy",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/pyproject.toml",
]